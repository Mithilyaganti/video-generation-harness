# Arm C is plain dsh. This file does not load the scoring plugins.
# It only selects the stock OpenCode Go route and lets headless finish
# without an approval prompt. The schema stays in the task text.
- id: agent-default-model
  config:
    provider: opencode-go
    model: deepseek-v4.1-flash
- id: llm-pi-ai
  config:
    providers:
      opencode-go:
        apiKeyEnv: OPENCODE_API_KEY
- id: approval
  config:
    policy: never
- id: permission
  config:
    defaultPreset: headless-run
    presets:
      workspace-write:
        sandbox: workspace-write
        approval: ask
        name: workspace-write
        description: Write inside the workspace. Wider retries require approval.
      danger-full-access:
        sandbox: danger-full-access
        approval: never
        name: danger-full-access
        description: Full file access without approval prompts.
      headless-run:
        sandbox: workspace-write
        approval: never
        name: headless-run
        description: Write inside the workspace without an approval prompt.
